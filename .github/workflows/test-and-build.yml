# Shared job: unit tests, production build, browser smoke tests.
# Called by pr-preview.yml and deploy-main.yml; uploads the built site as an artifact.
name: Test and build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Unit tests (rules, whole-dataset sweep, site plans)
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
          retention-days: 3
