# Shared job: unit tests, production build, browser smoke tests.
# Called by pr-preview.yml and deploy-main.yml; uploads the built site as an artifact.
name: Test and build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Unit tests (rules, whole-dataset sweep, site plans)
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Commit shown in the error screen's Developer Info. On a PR, github.sha is a
          # temporary merge commit, so use the PR's own head commit instead.
          BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # Usability telemetry (see web/TELEMETRY.md). Repository *variables*, not secrets:
          # a PostHog project key is public by design. Unset = telemetry off.
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: web/dist
          retention-days: 3
